<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ読書本棚</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --accent-color: #2e7d32;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #d7ccc8;
    }

    h1 {
      font-size: 1.8rem;
      color: #4e342e;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary:hover {
      background-color: #1b5e20;
    }

    .btn-secondary {
      background-color: #757575;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    /* モーダル表示 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-group textarea {
      height: 90px;
      resize: vertical;
    }

    .preview-card {
      background: #f9f9f9;
      border: 1px dashed #bbb;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .preview-cover {
      width: 50px;
      height: 70px;
      object-fit: cover;
      background: #eee;
      border-radius: 4px;
    }

    /* 本棚 */
    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 25px 20px;
      padding: 20px 0;
    }

    .book-item {
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .book-item:hover {
      transform: translateY(-5px);
    }

    .cover-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1.4;
      background-color: #e0e0e0;
      border-radius: 4px 8px 8px 4px;
      overflow: hidden;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dummy-cover {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      background: linear-gradient(135deg, #a1887f, #6d4c41);
      color: white;
    }

    .book-title-sub {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .book-rating-sub {
      font-size: 0.8rem;
      color: #f39c12;
      margin-top: 2px;
    }

    /* 詳細表示 */
    .detail-container {
      display: flex;
      gap: 20px;
    }

    .detail-cover {
      width: 120px;
      aspect-ratio: 1 / 1.4;
      flex-shrink: 0;
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      object-fit: cover;
    }

    .detail-info {
      flex-grow: 1;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .detail-meta {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
    }

    .detail-rating {
      color: #f39c12;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .detail-review {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
      white-space: pre-wrap;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 My Bookshelf</h1>
    <div class="header-buttons">
      <button id="addBookBtn" class="btn-primary hidden" onclick="openAddModal()">＋ 本を追加する</button>
      <button id="loginBtn" class="btn-secondary" onclick="openLoginModal()">🔑 管理者ログイン</button>
      <button id="logoutBtn" class="btn-secondary hidden" onclick="handleLogout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="bookshelf" id="bookshelf"></div>
  </main>

  <!-- ログインモーダル -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeLoginModal()">&times;</button>
      <h2 style="margin-bottom: 15px;">管理者ログイン</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">メールアドレス</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">パスワード</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">ログイン</button>
      </form>
    </div>
  </div>

  <!-- 本追加モーダル -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddModal()">&times;</button>
      <h2 style="margin-bottom: 15px;">新しい本を記録</h2>
      <form id="addBookForm" onsubmit="handleAddBook(event)">
        <div class="form-group">
          <label for="isbn">ISBN (13桁) *</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="isbn" placeholder="例: 9784004110828" required>
            <button type="button" class="btn-secondary" onclick="lookupIsbn()">検索</button>
          </div>
          <div id="isbnPreview" class="preview-card hidden">
            <img id="previewCover" class="preview-cover" src="" alt="">
            <div>
              <div id="previewTitle" style="font-weight: bold;"></div>
              <div id="previewAuthor" style="font-size: 0.85rem; color: #666;"></div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="rating">評価 (★1〜10)</label>
          <select id="rating">
            <option value="10">★10 - 最高</option>
            <option value="9">★9</option>
            <option value="8">★8</option>
            <option value="7">★7</option>
            <option value="6">★6</option>
            <option value="5" selected>★5 - 普通</option>
            <option value="4">★4</option>
            <option value="3">★3</option>
            <option value="2">★2</option>
            <option value="1">★1</option>
          </select>
        </div>
        <div class="form-group">
          <label for="review">感想・メモ</label>
          <textarea id="review" placeholder="感想など..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">保存する</button>
      </form>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
      <div class="detail-container">
        <div id="detailCoverContainer"></div>
        <div class="detail-info">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-rating" id="detailRating"></div>
          <div class="detail-review" id="detailReview"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://hmvhovuwhgotolklgajt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtdmhvdnV3aGdvdG9sa2xnYWp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTA4NzksImV4cCI6MjEwMzQ2Njg3OX0.MqlXUiYx2zMV0Z6UEOcVbVM76OKMfB_T60gu57RrOkM';
  const supabase_client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let booksData = [];

  window.onload = async () => {
    fetchBooks();
    checkUserSession();
    document.getElementById('isbn').addEventListener('blur', lookupIsbn);
  };

  async function checkUserSession() {
    const { data: { session } } = await supabase_client.auth.getSession();
    if (session) {
      document.getElementById('addBookBtn').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('loginBtn').classList.add('hidden');
    } else {
      document.getElementById('addBookBtn').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('loginBtn').classList.remove('hidden');
    }
  }

  // 1. SupabaseからISBN一覧を取得し、openBD APIから一括で詳細情報を補完
  async function fetchBooks() {
    const { data, error } = await supabase_client
      .from('books')
      .select('*')
      .order('created_at', { ascending: false });

    if (error || !data) return;

    const isbns = data.map(b => b.isbn).filter(Boolean);

    if (isbns.length === 0) {
      booksData = [];
      renderBookshelf();
      return;
    }

    // openBD APIはカンマ区切りで複数のISBNを一括取得可能
    try {
      const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbns.join(',')}`);
      const openBdData = await res.json();

      // ISBNをキーにしたマップを作成
      const bdMap = {};
      openBdData.forEach(item => {
        if (item && item.summary) {
          bdMap[item.summary.isbn] = item.summary;
        }
      });

      // SupabaseのデータとopenBDの書誌情報を結合
      booksData = data.map(book => {
        const info = bdMap[book.isbn] || {};
        return {
          id: book.id,
          isbn: book.isbn,
          rating: book.rating,
          review: book.review,
          title: info.title || 'タイトル不明',
          author: info.author || '',
          publisher: info.publisher || '',
          coverUrl: info.cover || null
        };
      });

      renderBookshelf();
    } catch (e) {
      console.error('openBD取得エラー:', e);
    }
  }

  // ISBNプレビュー検索
  async function lookupIsbn() {
    const rawIsbn = document.getElementById('isbn').value.trim();
    const isbn = rawIsbn.replace(/-/g, '');

    if (!isbn || isbn.length < 10) return;

    try {
      const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
      const data = await res.json();

      if (data && data[0]) {
        const summary = data[0].summary;
        document.getElementById('previewTitle').innerText = summary.title;
        document.getElementById('previewAuthor').innerText = `${summary.author} (${summary.publisher})`;
        if (summary.cover) {
          document.getElementById('previewCover').src = summary.cover;
          document.getElementById('previewCover').style.display = 'block';
        } else {
          document.getElementById('previewCover').style.display = 'none';
        }
        document.getElementById('isbnPreview').classList.remove('hidden');
      } else {
        alert('書誌情報が見つかりませんでした。');
      }
    } catch (err) {
      console.error(err);
    }
  }

  // 2. 本棚の描画
  function renderBookshelf() {
    const container = document.getElementById('bookshelf');
    container.innerHTML = '';

    booksData.forEach(book => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.onclick = () => openDetailModal(book);

      const coverHtml = book.coverUrl 
        ? `<img src="${escapeHtml(book.coverUrl)}" class="cover-image">`
        : `<div class="dummy-cover">${escapeHtml(book.title)}</div>`;

      item.innerHTML = `
        <div class="cover-wrapper">${coverHtml}</div>
        <div class="book-title-sub">${escapeHtml(book.title)}</div>
        <div class="book-rating-sub">★ ${book.rating}/10</div>
      `;

      container.appendChild(item);
    });
  }

  // 保存処理（ISBN、評価、感想、user_id のみ保存）
  async function handleAddBook(event) {
    event.preventDefault();

    const { data: { session } } = await supabase_client.auth.getSession();
    if (!session) {
      alert('ログインが必要です。');
      return;
    }

    const rawIsbn = document.getElementById('isbn').value.trim();
    const isbn = rawIsbn.replace(/-/g, '');
    const rating = parseInt(document.getElementById('rating').value);
    const review = document.getElementById('review').value.trim();

    const { error } = await supabase_client
      .from('books')
      .insert([
        { 
          isbn: isbn,
          rating: rating, 
          review: review || null,
          user_id: session.user.id
        }
      ]);

    if (error) {
      alert('保存失敗: ' + error.message);
      return;
    }

    document.getElementById('addBookForm').reset();
    document.getElementById('isbnPreview').classList.add('hidden');
    closeAddModal();
    fetchBooks();
  }

  // ログイン・ログアウト関連
  async function handleLogin(e) {
    e.preventDefault();
    const { error } = await supabase_client.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPassword').value.trim()
    });
    if (error) alert('ログイン失敗: ' + error.message);
    else { closeLoginModal(); checkUserSession(); }
  }

  async function handleLogout() {
    await supabase_client.auth.signOut();
    checkUserSession();
  }

  function openAddModal() { document.getElementById('addModal').classList.add('active'); }
  function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
  function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
  function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

  function openDetailModal(book) {
    document.getElementById('detailTitle').innerText = book.title;
    document.getElementById('detailMeta').innerText = `${book.author} / ${book.publisher}`;
    document.getElementById('detailRating').innerText = `★ ${book.rating} / 10`;
    document.getElementById('detailReview').innerText = book.review || '感想なし';

    const coverContainer = document.getElementById('detailCoverContainer');
    coverContainer.innerHTML = book.coverUrl 
      ? `<img src="${escapeHtml(book.coverUrl)}" class="detail-cover">`
      : `<div class="dummy-cover detail-cover">${escapeHtml(book.title)}</div>`;

    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetailModal() { document.getElementById('detailModal').classList.remove('active'); }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }
</script>
</body>
</html>
