<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ読書本棚</title>
  <!-- Supabase SDK の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --shelf-color: #8d6e63;
      --accent-color: #2e7d32;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #d7ccc8;
    }

    h1 {
      font-size: 1.8rem;
      color: #4e342e;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #1b5e20;
    }

    /* 追加フォーム（モーダル） */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-group textarea {
      height: 90px;
      resize: vertical;
    }

    /* 本棚（グリッドレイアウト） */
    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 25px 20px;
      padding: 20px 0;
    }

    .book-item {
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .book-item:hover {
      transform: translateY(-5px);
    }

    .cover-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1.4;
      background-color: #e0e0e0;
      border-radius: 4px 8px 8px 4px;
      overflow: hidden;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
      position: relative;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dummy-cover {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      background: linear-gradient(135deg, #a1887f, #6d4c41);
      color: white;
      box-sizing: border-box;
    }

    .book-title-sub {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .book-rating-sub {
      font-size: 0.8rem;
      color: #f39c12;
      margin-top: 2px;
    }

    /* 詳細モーダル */
    .detail-container {
      display: flex;
      gap: 20px;
    }

    .detail-cover {
      width: 120px;
      aspect-ratio: 1 / 1.4;
      flex-shrink: 0;
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      object-fit: cover;
    }

    .detail-info {
      flex-grow: 1;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .detail-rating {
      color: #f39c12;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .detail-review {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
      white-space: pre-wrap;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 My Bookshelf</h1>
    <button class="btn-primary" onclick="openAddModal()">＋ 本を追加する</button>
  </header>

  <!-- 本棚表示エリア -->
  <main>
    <div class="bookshelf" id="bookshelf">
      <!-- JSで動的に追加されます -->
    </div>
  </main>

  <!-- 本追加モーダル -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddModal()">&times;</button>
      <h2 style="margin-bottom: 15px;">新しい本を記録</h2>
      <form id="addBookForm" onsubmit="handleAddBook(event)">
        <div class="form-group">
          <label for="title">タイトル *</label>
          <input type="text" id="title" placeholder="例: 思考の整理学" required>
        </div>
        <div class="form-group">
          <label for="coverUrl">表紙画像URL (任意)</label>
          <input type="url" id="coverUrl" placeholder="https://example.com/cover.jpg">
        </div>
        <div class="form-group">
          <label for="rating">評価 (★1〜10)</label>
          <select id="rating">
            <option value="10">★10 - 最高</option>
            <option value="9">★9</option>
            <option value="8">★8</option>
            <option value="7">★7</option>
            <option value="6">★6</option>
            <option value="5" selected>★5 - 普通</option>
            <option value="4">★4</option>
            <option value="3">★3</option>
            <option value="2">★2</option>
            <option value="1">★1</option>
          </select>
        </div>
        <div class="form-group">
          <label for="review">感想・メモ</label>
          <textarea id="review" placeholder="印象に残ったフレーズや感想..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">本棚に並べる</button>
      </form>
    </div>
  </div>

  <!-- 詳細確認モーダル -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
      <div class="detail-container">
        <div id="detailCoverContainer"></div>
        <div class="detail-info">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-rating" id="detailRating"></div>
          <div class="detail-review" id="detailReview"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  // --- Supabaseの設定 ---
  const SUPABASE_URL = 'https://hmvhovuwhgotolklgajt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtdmhvdnV3aGdvdG9sa2xnYWp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTA4NzksImV4cCI6MjEwMzQ2Njg3OX0.MqlXUiYx2zMV0Z6UEOcVbVM76OKMfB_T60gu57RrOkM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let booksData = [];

  // 画面が開いたときにSupabaseからデータを取得
  window.onload = () => {
    fetchBooks();
  };

  // 1. Supabaseから本一覧を取得する処理
  async function fetchBooks() {
    const { data, error } = await supabase
      .from('books')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('データ取得エラー:', error);
      alert('データの取得に失敗しました: ' + error.message);
      return;
    }

    booksData = data.map(book => ({
      id: book.id,
      title: book.title,
      coverUrl: book.cover_url,
      rating: book.rating,
      review: book.review
    }));

    renderBookshelf();
  }

  // 2. 本棚の描画処理
  function renderBookshelf() {
    const container = document.getElementById('bookshelf');
    container.innerHTML = '';

    booksData.forEach(book => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.onclick = () => openDetailModal(book);

      const coverHtml = book.coverUrl 
        ? `<img src="${escapeHtml(book.coverUrl)}" class="cover-image" alt="${escapeHtml(book.title)}">`
        : `<div class="dummy-cover">${escapeHtml(book.title)}</div>`;

      item.innerHTML = `
        <div class="cover-wrapper">
          ${coverHtml}
        </div>
        <div class="book-title-sub">${escapeHtml(book.title)}</div>
        <div class="book-rating-sub">★ ${book.rating}/10</div>
      `;

      container.appendChild(item);
    });
  }

  // 3. Supabaseへの本追加処理
  async function handleAddBook(event) {
    event.preventDefault();

    const title = document.getElementById('title').value.trim();
    const coverUrl = document.getElementById('coverUrl').value.trim();
    const rating = parseInt(document.getElementById('rating').value);
    const review = document.getElementById('review').value.trim();

    const { data, error } = await supabase
      .from('books')
      .insert([
        { 
          title: title, 
          cover_url: coverUrl || null, 
          rating: rating, 
          review: review || null 
        }
      ]);

    if (error) {
      console.error('保存エラー:', error);
      alert('保存に失敗しました: ' + error.message);
      return;
    }

    document.getElementById('addBookForm').reset();
    closeAddModal();
    fetchBooks();
  }

  // モーダル制御
  function openAddModal() {
    document.getElementById('addModal').classList.add('active');
  }

  function closeAddModal() {
    document.getElementById('addModal').classList.remove('active');
  }

  function openDetailModal(book) {
    document.getElementById('detailTitle').innerText = book.title;
    document.getElementById('detailRating').innerText = `★ ${book.rating} / 10`;
    document.getElementById('detailReview').innerText = book.review || '感想は登録されていません。';

    const coverContainer = document.getElementById('detailCoverContainer');
    coverContainer.innerHTML = book.coverUrl 
      ? `<img src="${escapeHtml(book.coverUrl)}" class="detail-cover">`
      : `<div class="dummy-cover detail-cover">${escapeHtml(book.title)}</div>`;

    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetailModal() {
    document.getElementById('detailModal').classList.remove('active');
  }

  // エスケープ関数
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[m]);
  }
</script>
</body>
</html>
