<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書記録・本棚アプリ</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #4a90e2;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 30px auto;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 登録フォーム */
    .form-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 1rem;
    }

    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* 本棚グリッド */
    .bookshelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
    }

    .book-item {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .book-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .cover-wrapper {
      width: 100%;
      height: 200px;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dummy-cover {
      padding: 10px;
      font-size: 0.8rem;
      text-align: center;
      color: #666;
      word-break: break-all;
    }

    .book-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .book-title-sub {
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-rating-sub {
      font-size: 0.8rem;
      color: #f39c12;
      margin-top: auto;
    }

    /* 詳細モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .detail-cover-container {
      text-align: center;
      margin-bottom: 15px;
    }

    .detail-cover {
      max-height: 250px;
      object-fit: contain;
    }

    .detail-meta {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .detail-review {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      white-space: pre-wrap;
    }
  </style>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1>マイ本棚・読書記録</h1>
  </header>

  <div class="container">
    <!-- 本の登録フォーム -->
    <div class="form-card">
      <h2>新しい本を登録</h2>
      <form id="addBookForm">
        <div class="form-group">
          <label for="isbn">ISBNコード（半角数字・ハイフンなし）</label>
          <input type="text" id="isbn" placeholder="例: 9784834083569" required>
        </div>
        <div class="form-group">
          <label for="rating">評価 (1〜10)</label>
          <input type="number" id="rating" min="1" max="10" value="5" required>
        </div>
        <div class="form-group">
          <label for="review">感想・メモ</label>
          <textarea id="review" rows="3" placeholder="本の感想を入力..."></textarea>
        </div>
        <button type="submit" class="btn">本棚に追加</button>
      </form>
    </div>

    <!-- 本棚一覧 -->
    <div id="bookshelf" class="bookshelf-grid"></div>
  </div>

  <!-- 詳細表示モーダル -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="detailCoverContainer" class="detail-cover-container"></div>
      <h2 id="detailTitle"></h2>
      <div id="detailMeta" class="detail-meta"></div>
      <div id="detailRating" style="color: #f39c12; font-weight: bold;"></div>
      <div id="detailReview" class="detail-review"></div>
    </div>
  </div>

  <script>
    // 1. Supabase の初期化（ご自身のURLとKEYに変更してください）
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase_client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let booksData = [];

    // エスケープ処理
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ISBNから版元ドットコムの画像URLを直接生成
    function getCoverUrl(isbn) {
      if (!isbn) return null;
      return `https://img.hanmoto.com/bd/img/${isbn}.jpg`;
    }

    // 2. 本のデータ取得 (Supabase + openBDでタイトル/著者のみ補完)
    async function fetchBooks() {
      try {
        const { data, error } = await supabase_client
          .from('books')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        if (!data || data.length === 0) {
          booksData = [];
          renderBookshelf();
          return;
        }

        const isbns = data.map(b => b.isbn).filter(Boolean);

        // openBD API（タイトルや著者情報のみ取得）
        const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbns.join(',')}`);
        const openBdData = await res.json();

        const bdMap = {};
        if (Array.isArray(openBdData)) {
          openBdData.forEach(item => {
            if (item && item.summary && item.summary.isbn) {
              bdMap[item.summary.isbn] = item.summary;
            }
          });
        }

        // DBデータと結合（画像は直接生成）
        booksData = data.map(book => {
          const summary = bdMap[book.isbn] || {};

          return {
            id: book.id,
            isbn: book.isbn,
            rating: book.rating,
            review: book.review,
            title: summary.title || 'タイトル不明',
            author: summary.author || '',
            publisher: summary.publisher || '',
            coverUrl: getCoverUrl(book.isbn)
          };
        });

        renderBookshelf();
      } catch (e) {
        console.error('データ取得エラー:', e);
      }
    }

    // 3. 本棚の描画（画像エラー時は自動でダミー表示に切り替え）
    function renderBookshelf() {
      const container = document.getElementById('bookshelf');
      container.innerHTML = '';

      if (booksData.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">本がまだ登録されていません。</p>';
        return;
      }

      booksData.forEach(book => {
        const item = document.createElement('div');
        item.className = 'book-item';
        item.onclick = () => openDetailModal(book);

        // onerrorで画像読み込み失敗時にテキストを表示
        const coverHtml = book.coverUrl 
          ? `<img src="${escapeHtml(book.coverUrl)}" class="cover-image" alt="${escapeHtml(book.title)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
             <div class="dummy-cover" style="display:none;">${escapeHtml(book.title)}</div>`
          : `<div class="dummy-cover">${escapeHtml(book.title)}</div>`;

        item.innerHTML = `
          <div class="cover-wrapper">${coverHtml}</div>
          <div class="book-info">
            <div class="book-title-sub">${escapeHtml(book.title)}</div>
            <div class="book-rating-sub">★ ${book.rating}/10</div>
          </div>
        `;

        container.appendChild(item);
      });
    }

    // 4. 詳細モーダルの表示
    function openDetailModal(book) {
      document.getElementById('detailTitle').innerText = book.title;
      document.getElementById('detailMeta').innerText = `${book.author} ${book.publisher ? '/ ' + book.publisher : ''}`;
      document.getElementById('detailRating').innerText = `★ ${book.rating} / 10`;
      document.getElementById('detailReview').innerText = book.review || '感想はありません。';

      const coverContainer = document.getElementById('detailCoverContainer');
      coverContainer.innerHTML = book.coverUrl 
        ? `<img src="${escapeHtml(book.coverUrl)}" class="detail-cover" alt="${escapeHtml(book.title)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
           <div class="dummy-cover detail-cover" style="display:none;">${escapeHtml(book.title)}</div>`
        : `<div class="dummy-cover detail-cover">${escapeHtml(book.title)}</div>`;

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // 5. 新規本の登録イベント
    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const isbn = document.getElementById('isbn').value.trim();
      const rating = parseInt(document.getElementById('rating').value, 10);
      const review = document.getElementById('review').value.trim();

      if (!isbn) return;

      try {
        const { error } = await supabase_client
          .from('books')
          .insert([{ isbn, rating, review }]);

        if (error) throw error;

        document.getElementById('addBookForm').reset();
        await fetchBooks();
      } catch (e) {
        console.error('登録エラー:', e);
        alert('登録に失敗しました。');
      }
    });

    window.addEventListener('DOMContentLoaded', fetchBooks);
  </script>
</body>
</html>
