<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ読書本棚</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --accent-color: #2e7d32;
      --danger-color: #c62828;
      --text-color: #333333;
      --book-width: 140px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #d7ccc8;
    }

    h1 {
      font-size: 1.8rem;
      color: #4e342e;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #555;
    }

    .size-slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-slider-group input[type="range"] {
      cursor: pointer;
      width: 120px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary:hover {
      background-color: #1b5e20;
    }

    .btn-secondary {
      background-color: #757575;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-danger:hover {
      background-color: #b71c1c;
    }

    .hidden {
      display: none !important;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-group textarea {
      height: 90px;
      resize: vertical;
    }

    .preview-card {
      background: #f9f9f9;
      border: 1px dashed #bbb;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .preview-cover {
      width: 50px;
      height: 70px;
      object-fit: cover;
      background: #eee;
      border-radius: 4px;
    }

    /* 本棚グリッド */
    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--book-width), 1fr));
      gap: 25px 20px;
      padding: 10px 0;
    }

    .book-item {
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .book-item:hover {
      transform: translateY(-5px);
    }

    .cover-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1.4;
      background-color: #e0e0e0;
      border-radius: 4px 8px 8px 4px;
      overflow: hidden;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dummy-cover {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      background: linear-gradient(135deg, #a1887f, #6d4c41);
      color: white;
    }

    .book-title-sub {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .book-rating-sub {
      font-size: 0.8rem;
      color: #f39c12;
      margin-top: 2px;
    }

    /* 詳細ダイアログ */
    .detail-container {
      display: flex;
      gap: 20px;
    }

    .detail-cover {
      width: 120px;
      aspect-ratio: 1 / 1.4;
      flex-shrink: 0;
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      object-fit: cover;
    }

    .detail-info {
      flex-grow: 1;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .detail-meta {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
    }

    .detail-rating {
      color: #f39c12;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .detail-review {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
      white-space: pre-wrap;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
    }

    .detail-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 My Bookshelf</h1>
    <div class="header-buttons">
      <button id="myShelfBtn" class="btn-secondary hidden" onclick="goToMyShelf()">自分の本棚へ</button>
      <button id="addBookBtn" class="btn-primary hidden" onclick="openAddModal()">＋ 本を追加する</button>
      <button id="loginBtn" class="btn-secondary" onclick="openLoginModal()">🔑 ログイン / 登録</button>
      <button id="logoutBtn" class="btn-secondary hidden" onclick="handleLogout()">ログアウト</button>
    </div>
  </header>

  <div class="toolbar">
    <div id="shelfOwnerText">本棚を表示中...</div>
    <div class="size-slider-group">
      <label for="sizeRange">📖 表示サイズ:</label>
      <input type="range" id="sizeRange" min="80" max="250" value="140" oninput="updateBookSize(this.value)">
      <span id="sizeValue">140px</span>
    </div>
  </div>

  <main>
    <div class="bookshelf" id="bookshelf"></div>
  </main>

  <!-- ログイン / 新規登録モーダル -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeLoginModal()">&times;</button>
      <h2 id="authModalTitle" style="margin-bottom: 15px;">ログイン</h2>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label for="loginEmail">メールアドレス</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">パスワード</label>
          <input type="password" id="loginPassword" required minlength="6">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn-primary" style="width: 100%;">ログイン</button>
      </form>
      <div style="margin-top: 15px; text-align: center; font-size: 0.85rem;">
        <span id="authToggleText">アカウントをお持ちでないですか？</span>
        <a href="#" id="authToggleLink" onclick="toggleAuthMode(event)" style="color: var(--accent-color); font-weight: bold;">新規登録はこちら</a>
      </div>
    </div>
  </div>

  <!-- 本追加モーダル -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddModal()">&times;</button>
      <h2 style="margin-bottom: 15px;">新しい本を記録</h2>
      <form id="addBookForm" onsubmit="handleAddBook(event)">
        <div class="form-group">
          <label for="isbn">ISBN (13桁) *</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="isbn" placeholder="例: 9784834083569" required>
            <button type="button" class="btn-secondary" onclick="lookupIsbn()">検索</button>
          </div>
          <div id="isbnPreview" class="preview-card hidden">
            <img id="previewCover" class="preview-cover" src="" alt="">
            <div>
              <div id="previewTitle" style="font-weight: bold;"></div>
              <div id="previewAuthor" style="font-size: 0.85rem; color: #666;"></div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="rating">評価 (★1〜10)</label>
          <select id="rating">
            <option value="10">★10 - 最高</option>
            <option value="9">★9</option>
            <option value="8">★8</option>
            <option value="7">★7</option>
            <option value="6">★6</option>
            <option value="5" selected>★5 - 普通</option>
            <option value="4">★4</option>
            <option value="3">★3</option>
            <option value="2">★2</option>
            <option value="1">★1</option>
          </select>
        </div>
        <div class="form-group">
          <label for="review">感想・メモ</label>
          <textarea id="review" placeholder="感想など..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">保存する</button>
      </form>
    </div>
  </div>

  <!-- 本編集モーダル -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
      <h2 style="margin-bottom: 15px;">本情報を編集</h2>
      <form id="editBookForm" onsubmit="handleEditBook(event)">
        <input type="hidden" id="editBookId">
        <div class="form-group">
          <label>タイトル</label>
          <div id="editTitleText" style="font-weight: bold; margin-bottom: 10px;"></div>
        </div>
        <div class="form-group">
          <label for="editRating">評価 (★1〜10)</label>
          <select id="editRating">
            <option value="10">★10 - 最高</option>
            <option value="9">★9</option>
            <option value="8">★8</option>
            <option value="7">★7</option>
            <option value="6">★6</option>
            <option value="5">★5 - 普通</option>
            <option value="4">★4</option>
            <option value="3">★3</option>
            <option value="2">★2</option>
            <option value="1">★1</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editReview">感想・メモ</label>
          <textarea id="editReview" placeholder="感想など..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">更新する</button>
      </form>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
      <div class="detail-container">
        <div id="detailCoverContainer"></div>
        <div class="detail-info">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-rating" id="detailRating"></div>
          <div class="detail-review" id="detailReview"></div>
        </div>
      </div>
      <div class="detail-actions hidden" id="adminActions">
        <button class="btn-secondary" onclick="openEditModal()">編集</button>
        <button class="btn-danger" onclick="handleDeleteBook()">削除</button>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://hmvhovuwhgotolklgajt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtdmhvdnV3aGdvdG9sa2xnYWp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTA4NzksImV4cCI6MjEwMzQ2Njg3OX0.MqlXUiYx2zMV0Z6UEOcVbVM76OKMfB_T60gu57RrOkM';
  const supabase_client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let booksData = [];
  let currentBook = null;
  let targetUserId = null;
  let currentSessionUser = null;
  let isSignUpMode = false;

  window.onload = async () => {
    const savedSize = localStorage.getItem('bookshelf_item_size');
    if (savedSize) {
      document.getElementById('sizeRange').value = savedSize;
      updateBookSize(savedSize);
    }

    const urlParams = new URLSearchParams(window.location.search);
    targetUserId = urlParams.get('user');

    const { data: { session } } = await supabase_client.auth.getSession();
    currentSessionUser = session ? session.user : null;

    if (!targetUserId && currentSessionUser) {
      targetUserId = currentSessionUser.id;
      const newUrl = `${window.location.pathname}?user=${targetUserId}`;
      window.history.replaceState(null, '', newUrl);
    }

    updateUI();
    fetchBooks();
    document.getElementById('isbn').addEventListener('blur', lookupIsbn);
  };

  function updateBookSize(val) {
    document.documentElement.style.setProperty('--book-width', `${val}px`);
    document.getElementById('sizeValue').innerText = `${val}px`;
    localStorage.setItem('bookshelf_item_size', val);
  }

  function updateUI() {
    const isOwner = currentSessionUser && targetUserId === currentSessionUser.id;

    if (currentSessionUser) {
      document.getElementById('loginBtn').classList.add('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      
      if (!isOwner) {
        document.getElementById('myShelfBtn').classList.remove('hidden');
      } else {
        document.getElementById('myShelfBtn').classList.add('hidden');
      }
    } else {
      document.getElementById('loginBtn').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('myShelfBtn').classList.add('hidden');
    }

    if (isOwner) {
      document.getElementById('addBookBtn').classList.remove('hidden');
      document.getElementById('adminActions').classList.remove('hidden');
      document.getElementById('shelfOwnerText').innerText = '自分の本棚を表示中';
    } else {
      document.getElementById('addBookBtn').classList.add('hidden');
      document.getElementById('adminActions').classList.add('hidden');
      document.getElementById('shelfOwnerText').innerText = targetUserId 
        ? `ユーザー (${targetUserId.substring(0, 8)}...) の本棚`
        : '公開本棚（ユーザー未指定）';
    }
  }

  function goToMyShelf() {
    if (currentSessionUser) {
      window.location.href = `${window.location.pathname}?user=${currentSessionUser.id}`;
    }
  }

  function extractCoverUrl(isbn) {
    if (!isbn) return null;
    const cleanIsbn = isbn.toString().replace(/-/g, '').trim();
    return cleanIsbn ? `https://img.hanmoto.com/bd/img/${cleanIsbn}_600.jpg` : null;
  }

  async function fetchBooks() {
    let query = supabase_client.from('books').select('*').order('created_at', { ascending: false });

    if (targetUserId) {
      query = query.eq('user_id', targetUserId);
    }

    const { data, error } = await query;

    if (error || !data) {
      booksData = [];
      renderBookshelf();
      return;
    }

    const isbns = data.map(b => b.isbn).filter(Boolean);

    if (isbns.length === 0) {
      booksData = [];
      renderBookshelf();
      return;
    }

    try {
      const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbns.join(',')}`);
      const openBdData = await res.json();

      const bdMap = {};
      if (openBdData) {
        openBdData.forEach(item => {
          if (item && item.summary) {
            bdMap[item.summary.isbn] = item;
          }
        });
      }

      booksData = data.map(book => {
        const item = bdMap[book.isbn];
        const summary = item ? item.summary : {};

        return {
          id: book.id,
          isbn: book.isbn,
          rating: book.rating,
          review: book.review,
          title: summary.title || 'タイトル不明',
          author: summary.author || '',
          publisher: summary.publisher || '',
          coverUrl: extractCoverUrl(book.isbn)
        };
      });

      renderBookshelf();
    } catch (e) {
      console.error('openBD取得エラー:', e);
    }
  }

  async function lookupIsbn() {
    const rawIsbn = document.getElementById('isbn').value.trim();
    const isbn = rawIsbn.replace(/-/g, '');

    if (!isbn || isbn.length < 10) return;

    try {
      const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
      const data = await res.json();

      if (data && data[0]) {
        const item = data[0];
        const summary = item.summary;
        const coverUrl = extractCoverUrl(isbn);

        document.getElementById('previewTitle').innerText = summary.title;
        document.getElementById('previewAuthor').innerText = `${summary.author} (${summary.publisher})`;
        
        if (coverUrl) {
          document.getElementById('previewCover').src = coverUrl;
          document.getElementById('previewCover').style.display = 'block';
        } else {
          document.getElementById('previewCover').style.display = 'none';
        }
        document.getElementById('isbnPreview').classList.remove('hidden');
      } else {
        alert('書誌情報が見つかりませんでした。');
      }
    } catch (err) {
      console.error(err);
    }
  }

  function renderBookshelf() {
    const container = document.getElementById('bookshelf');
    container.innerHTML = '';

    if (booksData.length === 0) {
      container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 0;">まだ本が登録されていません。</div>';
      return;
    }

    booksData.forEach(book => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.onclick = () => openDetailModal(book);

      const coverHtml = book.coverUrl 
        ? `<img src="${escapeHtml(book.coverUrl)}" class="cover-image" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'dummy-cover\'>${escapeHtml(book.title)}</div>';">`
        : `<div class="dummy-cover">${escapeHtml(book.title)}</div>`;

      item.innerHTML = `
        <div class="cover-wrapper">${coverHtml}</div>
        <div class="book-title-sub">${escapeHtml(book.title)}</div>
        <div class="book-rating-sub">★ ${book.rating}/10</div>
      `;

      container.appendChild(item);
    });
  }

  async function handleAddBook(event) {
    event.preventDefault();

    if (!currentSessionUser) {
      alert('ログインが必要です。');
      return;
    }

    const rawIsbn = document.getElementById('isbn').value.trim();
    const isbn = rawIsbn.replace(/-/g, '');
    const rating = parseInt(document.getElementById('rating').value);
    const review = document.getElementById('review').value.trim();

    const { error } = await supabase_client
      .from('books')
      .insert([
        { 
          isbn: isbn,
          rating: rating, 
          review: review || null,
          user_id: currentSessionUser.id
        }
      ]);

    if (error) {
      alert('保存失敗: ' + error.message);
      return;
    }

    document.getElementById('addBookForm').reset();
    document.getElementById('isbnPreview').classList.add('hidden');
    closeAddModal();
    fetchBooks();
  }

  function openEditModal() {
    if (!currentBook) return;
    document.getElementById('editBookId').value = currentBook.id;
    document.getElementById('editTitleText').innerText = currentBook.title;
    document.getElementById('editRating').value = currentBook.rating;
    document.getElementById('editReview').value = currentBook.review || '';
    
    closeDetailModal();
    document.getElementById('editModal').classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
  }

  async function handleEditBook(event) {
    event.preventDefault();
    const id = document.getElementById('editBookId').value;
    const rating = parseInt(document.getElementById('editRating').value);
    const review = document.getElementById('editReview').value.trim();

    const { error } = await supabase_client
      .from('books')
      .update({ rating: rating, review: review || null })
      .eq('id', id);

    if (error) {
      alert('更新失敗: ' + error.message);
      return;
    }

    closeEditModal();
    fetchBooks();
  }

  async function handleDeleteBook() {
    if (!currentBook) return;

    const targetIsbn = currentBook.isbn.replace(/-/g, '');
    const inputIsbn = prompt(`誤削除防止のため、この本のISBNコードを入力してください。\n（対象: ${currentBook.title}\n  ISBN: ${targetIsbn}）`);

    if (inputIsbn === null) return;

    const cleanInputIsbn = inputIsbn
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/[\s-]/g, '');

    if (cleanInputIsbn !== targetIsbn) {
      alert('ISBNコードが一致しません。削除をキャンセルしました。');
      return;
    }

    const { data, error } = await supabase_client
      .from('books')
      .delete()
      .eq('id', currentBook.id)
      .select();

    if (error) {
      alert('削除失敗: ' + error.message);
      return;
    }

    if (!data || data.length === 0) {
      alert('削除に失敗しました（権限がないか、すでに削除されています）。SupabaseのRLS設定をご確認ください。');
      return;
    }

    alert('削除が完了しました。');
    closeDetailModal();
    fetchBooks();
  }

  function toggleAuthMode(e) {
    e.preventDefault();
    isSignUpMode = !isSignUpMode;

    const title = document.getElementById('authModalTitle');
    const btn = document.getElementById('authSubmitBtn');
    const text = document.getElementById('authToggleText');
    const link = document.getElementById('authToggleLink');

    if (isSignUpMode) {
      title.innerText = '新規アカウント登録';
      btn.innerText = 'アカウント作成';
      text.innerText = 'すでにアカウントをお持ちですか？';
      link.innerText = 'ログインはこちら';
    } else {
      title.innerText = 'ログイン';
      btn.innerText = 'ログイン';
      text.innerText = 'アカウントをお持ちでないですか？';
      link.innerText = '新規登録はこちら';
    }
  }

  async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (isSignUpMode) {
      const { data, error } = await supabase_client.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        alert('登録失敗: ' + error.message);
      } else {
        alert('仮登録が完了しました！\n入力されたメールアドレスに届いた確認リンクをクリックしてからログインしてください。');
        isSignUpMode = false;
        document.getElementById('authModalTitle').innerText = 'ログイン';
        document.getElementById('authSubmitBtn').innerText = 'ログイン';
        document.getElementById('authToggleText').innerText = 'アカウントをお持ちでないですか？';
        document.getElementById('authToggleLink').innerText = '新規登録はこちら';
      }
    } else {
      const { data, error } = await supabase_client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('ログイン失敗: ' + error.message);
      } else {
        currentSessionUser = data.user;
        closeLoginModal();
        window.location.href = `${window.location.pathname}?user=${currentSessionUser.id}`;
      }
    }
  }

  async function handleLogout() {
    await supabase_client.auth.signOut();
    currentSessionUser = null;
    updateUI();
    fetchBooks();
  }

  function openAddModal() { document.getElementById('addModal').classList.add('active'); }
  function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
  function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
  function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

  function openDetailModal(book) {
    currentBook = book;
    document.getElementById('detailTitle').innerText = book.title;
    document.getElementById('detailMeta').innerText = `${book.author} / ${book.publisher}`;
    document.getElementById('detailRating').innerText = `★ ${book.rating} / 10`;
    document.getElementById('detailReview').innerText = book.review || '感想なし';

    const coverContainer = document.getElementById('detailCoverContainer');
    coverContainer.innerHTML = book.coverUrl 
      ? `<img src="${escapeHtml(book.coverUrl)}" class="detail-cover" onerror="this.onerror=null; this.outerHTML='<div class=\'dummy-cover detail-cover\'>${escapeHtml(book.title)}</div>';">`
      : `<div class="dummy-cover detail-cover">${escapeHtml(book.title)}</div>`;

    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetailModal() { 
    document.getElementById('detailModal').classList.remove('active'); 
    currentBook = null;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }
</script>
</body>
</html>
